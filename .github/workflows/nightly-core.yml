name: Nightly Core

on:
  schedule:
    - cron: "17 2 * * *"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Nächtliches Core-Gate ausführen
        run: npm run gate:nightly

      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-core-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
