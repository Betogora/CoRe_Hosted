name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lokales Push-Gate ausführen
        run: npm run gate:push

  catalog-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps --only-shell chromium

      - name: Katalogflows ohne Supabase ausführen
        run: npm run test:e2e:catalog

      - name: Testdauern hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-e2e-timings-${{ github.run_id }}
          path: test-timings/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-e2e-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  affected-e2e-shard:
    if: github.event_name == 'pull_request'
    name: affected-e2e-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      CORE_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps --only-shell chromium

      - name: Betroffene Browserflows und RLS ausführen
        run: npm run test:e2e:affected:local

      - name: Testdauern hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affected-e2e-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: test-timings/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: affected-e2e-failure-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Required check: the branch protection expects one job with this name.
  affected-e2e:
    if: always() && github.event_name == 'pull_request'
    needs: affected-e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ergebnis der drei Shards prüfen
        run: test "${{ needs.affected-e2e-shard.result }}" = "success"
