name: Temporary Docs Generation
on:
  push:
    branches:
      - codex/pruefungsmodus-themenkalender
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: regenerated-docs
          path: docs/*.html
          retention-days: 1
