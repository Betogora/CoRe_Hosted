<article class="catalog-demo catalog-demo-wide"><h3>Stapelübersicht · gruppierte Liste und Ordner</h3><div class="catalog-demo-content"><p class="catalog-pattern-source">Der echte <code>LearnScreen</code> unter Produktansichten zeigt jeweils nur die andere Ansicht als Wechselbutton: <strong>Liste</strong> oder <strong>Ordner</strong>. Die Liste fasst Hauptstapel und alle sichtbaren Unterstapel in eigenen umrundeten Bereichen zusammen. Neutrale Unterstapelzeilen, kleinere Icons sowie gleich breite Kennzahlspalten folgen Variante B. Hauptstapelanzahl und globale Klappaktion stehen im kompakten Bereichskopf. Hauptstapelköpfe sind dezent getönt und zeigen Karten- sowie Unterstapelanzahl unter dem Namen. Auf schmalen Flächen stehen beschriftete Kennzahlen unter dem Namen; das Schnellformular bleibt unter der Liste erreichbar. Stapelzeilen zeigen keinen Fortschrittsring. Ordner zeigen große Tageszahlen und eine gemeinsame untere Aktionsleiste. Die Hauptstapel bleiben sichtbar; unter der Reihe des markierten Hauptstapels klappt das Zweigpanel mit kleineren Unterstapeln auf. Klickbarer Pfad, Zurück und Schließen stehen darüber. Inhalte und Lernstart sind pro Stapel und für den gesamten Zweig erreichbar. Die tatsächliche Inhaltsansicht verwendet einen vollständigen klickbaren Vorfahrenpfad über Stapelkopf und gleitender Icon-Leiste. Reihenfolge: Unterstapel, Zusammenfassungen, Quiz, Mind Map, Karten, Quelle. Auch der Unterstapel-Tab bietet den einzelnen Wechselbutton zwischen Liste und Ordnern. Unterstapel führen auf weitere Ebenen, Inhalte direkt zu deren Karten; Pfad und Zurück führen wieder nach oben. Beide Zustände werden in den interaktiven Produktdemos geprüft.</p></div></article>
